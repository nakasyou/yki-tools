[project]
name = "yki-cli"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["jsonschema>=4.23,<5"]

[project.scripts]
yki-cli = "yki_cli.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["yki_cli*"]
