[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yki-sdk"
version = "0.1.0"
description = "Python bindings for the MoonBit YKI and 3D WebAssembly modules"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["wasmtime>=49,<50"]

[tool.setuptools.packages.find]
include = ["yki_sdk*"]

[tool.setuptools.package-data]
yki_sdk = ["wasm/*.wasm", "py.typed"]
