name: Publish yki-sdk

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment from npm latest
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-yki-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Set up npm and MoonBit
        run: |
          npm install --global npm@11
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Calculate release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: node packages/yki-sdk/scripts/release-version.mjs
      - run: pnpm install --lockfile-only
      - name: Build and validate
        run: |
          pnpm --dir packages/3d run build
          pnpm --dir packages/yki-core run build
          pnpm --dir packages/yki-sdk run build
          pnpm --dir packages/3d run typecheck
          pnpm --dir packages/3d run test
          pnpm --dir packages/yki-sdk run typecheck
          pnpm --dir packages/yki-sdk run test
          pnpm --dir packages/yki-sdk run test:media
          pnpm exec vp fmt packages/3d packages/yki-sdk .github/workflows/publish.yml --check
          cd packages/yki-sdk
          npm pack --dry-run
      - name: Prepare release commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages/yki-sdk/package.json pnpm-lock.yaml
          git commit -m "Release yki-sdk $VERSION"
          git tag -a "$TAG" -m "yki-sdk $VERSION"
      - name: Publish with npm OIDC
        working-directory: packages/yki-sdk
        run: npm publish --access public
      - name: Push and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git push --atomic origin "HEAD:refs/heads/$DEFAULT_BRANCH" "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --generate-notes
